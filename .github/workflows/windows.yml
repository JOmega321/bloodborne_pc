name: Windows x64 package
on:
  push:
    branches: [english-windows-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CCACHE_DIR: C:/ccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: C:/ccache
          key: windows-clang64-${{ runner.os }}-${{ github.sha }}
          restore-keys: windows-clang64-${{ runner.os }}-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '9.0.x'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-python
      - name: Build native port and FSR assets
        shell: msys2 {0}
        run: bash packaging/windows/build-native.sh
      - name: Preserve native build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-x64
          path: |
            out/windows/native/*.exe
            out/windows/native/*.dll
            out/windows/msys2-packages.txt
            fsr4_shaders/
          if-no-files-found: error
          retention-days: 7
      - name: Freeze Python runner and publish WPF launcher
        shell: pwsh
        run: |
          $env:CLANG64_BIN = 'D:\a\_temp\msys64\clang64\bin'
          if (!(Test-Path $env:CLANG64_BIN)) { throw 'Missing CLANG64 runtime' }
          python -m pip install pyinstaller==6.16.0 pefile==2024.8.26
          python packaging/windows/package-native.py
      - name: Preserve package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-package-candidate
          path: dist/bbport-windows/
          if-no-files-found: error
          retention-days: 7
      - name: Verify packaged Windows launcher
        shell: pwsh
        run: ./packaging/windows/verify-native.ps1
      - name: Archive verified package
        shell: pwsh
        run: |
          $name = "Bloodborne-bbport-windows-x64-$(Get-Content VERSION -Raw)".Trim()
          $zip = "dist/$name.zip"
          Compress-Archive -Path dist/bbport-windows -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bloodborne-bbport-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Preserve compiler cache after failures
        if: failure()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: C:/ccache
          key: windows-clang64-${{ runner.os }}-${{ github.sha }}
      - name: Save compiler cache
        if: always()
        shell: msys2 {0}
        run: ccache --show-stats
