name: Windows x64 package
on:
  push:
    branches: [bbglorp-build, bbglorp-windows-build]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CCACHE_DIR: C:/ccache
      CLANG64_BIN: D:/a/_temp/msys64/clang64/bin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - name: Fetch pinned NVIDIA DLSS SDK
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: NVIDIA/DLSS
          ref: 9981c6350dc58c0ce21f024fd65e31e851c31689
          path: .deps/dlss-sdk
          sparse-checkout: |
            include
            lib/Windows_x86_64
            LICENSE.txt
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: C:/ccache
          key: windows-clang64-${{ runner.os }}-${{ github.sha }}
          restore-keys: windows-clang64-${{ runner.os }}-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '9.0.x'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: CLANG64
          update: true
          install: >-
            git patch
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-boost
            mingw-w64-clang-x86_64-fmt
            mingw-w64-clang-x86_64-robin-map
            mingw-w64-clang-x86_64-xxhash
            mingw-w64-clang-x86_64-vulkan-memory-allocator
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-glslang
            mingw-w64-clang-x86_64-spirv-tools
            mingw-w64-clang-x86_64-spirv-cross
            mingw-w64-clang-x86_64-zydis
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-sdl3
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-python
      - name: Verify and restore successful native build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin 37240c52839d1d7511c14f26b401e84fee0d1b32
          git diff --exit-code 37240c52839d1d7511c14f26b401e84fee0d1b32 HEAD -- . ':!packaging/windows/build-dlss.ps1' ':!.github/workflows/windows.yml'
          gh api /repos/JOmega321/bloodborne_pc/actions/artifacts/12914746688/zip > native-windows.zip
          python - <<'PYVERIFY'
          import hashlib, zipfile
          from pathlib import Path
          archive = Path('native-windows.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '6f1f10eb55d286605c6f8e66b7323df8cfa0a85a7d23397cb027b698b8e2de28', 'Native artifact checksum mismatch'
          with zipfile.ZipFile(archive) as z:
              z.extractall('.')
          PYVERIFY
      - name: Verify matching native runtime libraries
        shell: msys2 {0}
        run: |
          pacman -Q > out/windows/current-packages.txt
          python -c "from pathlib import Path; assert Path('out/windows/msys2-packages.txt').read_text().splitlines() == Path('out/windows/current-packages.txt').read_text().splitlines(), 'Runtime package versions differ from native build'"
      - name: Preserve native build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-x64
          path: |
            out/windows/native/*.exe
            out/windows/native/*.dll
            out/windows/msys2-packages.txt
            fsr4_shaders/
          if-no-files-found: error
          retention-days: 7
      - name: Build DLSS bridge with NVIDIA-compatible MSVC runtime
        shell: pwsh
        run: ./packaging/windows/build-dlss.ps1
      - name: Freeze Python runner and publish WPF launcher
        shell: pwsh
        run: |
          $env:CLANG64_BIN = 'D:\a\_temp\msys64\clang64\bin'
          if (!(Test-Path $env:CLANG64_BIN)) { throw 'Missing CLANG64 runtime' }
          python -m pip install pyinstaller==6.16.0 pefile==2023.2.7
          python packaging/windows/package-native.py
      - name: Preserve package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-package-candidate
          path: dist/bbglorp-windows/
          if-no-files-found: error
          retention-days: 7
      - name: Verify packaged Windows launcher
        shell: pwsh
        run: ./packaging/windows/verify-native.ps1
      - name: Archive verified package
        shell: pwsh
        run: |
          $name = "Bloodborne-bbglorp-windows-x64-$(Get-Content VERSION -Raw)".Trim()
          $zip = "dist/$name.zip"
          Compress-Archive -Path dist/bbglorp-windows -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Bloodborne-bbglorp-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Preserve compiler cache after failures
        if: failure()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: C:/ccache
          key: windows-clang64-${{ runner.os }}-${{ github.sha }}
      - name: Save compiler cache
        if: always()
        shell: msys2 {0}
        run: ccache --show-stats
